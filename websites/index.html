<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111">
<title>Websites — Josh Freeman</title>
<meta name="description" content="Websites">
<meta property="og:title" content="Websites — Josh Freeman">
<meta property="og:site_name" content="joshfreeman.org">
<meta property="og:url" content="https://joshfreeman.org/websites/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100svh;min-height:100dvh}
header{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 16px;
  padding:12px 20px;
  padding-top:calc(12px + env(safe-area-inset-top));
  padding-right:calc(20px + env(safe-area-inset-right));
  padding-left:calc(20px + env(safe-area-inset-left));
}
header nav{display:flex;gap:18px;align-items:center}
a{color:#fff}
h1{font-size:1.2rem;margin:0;font-weight:500}
a:focus-visible{outline:3px solid #0a5bd8;outline-offset:3px}
main{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100svh - 4.5rem);
  padding:24px 20px 48px;
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + env(safe-area-inset-right));
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
}
.site-figure{margin:0;width:min(999px,100%)}
.site-card{
  display:block;width:100%;text-decoration:none;color:inherit;
  background:#0a0a0a;container-type:inline-size;container-name:logo;
  border-radius:0;
}
.site-card:hover{outline:1px solid #d9bf86;outline-offset:4px}
.site-card:focus-visible{outline:3px solid #0a5bd8;outline-offset:4px}
.card-logo{
  display:flex;align-items:center;
  aspect-ratio:999/227;
  padding:4.905cqi 5.806cqi 3.804cqi 3.504cqi;
  gap:8.108cqi;
  background:#0a0a0a;
}
.emblem{width:14.114cqi;height:auto;flex:0 0 auto;display:block}
.card-word{
  font-family:Cinzel,Georgia,"Times New Roman",serif;
  font-weight:400;
  font-size:8.579cqi;
  color:#f0e8d8;
  letter-spacing:.313em;
  margin:0 -.313em 0 0;
  line-height:1;
  white-space:nowrap;
}
.caption{
  margin:14px 2px 0;
  font-size:.85rem;
  color:#ccc;
  text-align:center;
  font-weight:400;
}
.sites-list{width:min(999px,100%);display:flex;flex-direction:column;align-items:center;gap:36px}
.more-card{
  display:flex;align-items:center;justify-content:center;
  width:100%;background:#0a0a0a;text-decoration:none;color:#f0e8d8;
  padding:28px 24px;font-size:1.15rem;font-weight:500;letter-spacing:.04em;
}
.more-card:hover{outline:1px solid #d9bf86;outline-offset:4px}
.more-card:focus-visible{outline:3px solid #0a5bd8;outline-offset:4px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1>Websites</h1>
  <nav aria-label="Site">
    <a href="../gallery/">Full Gallery</a>
    <a href="../">← Home</a>
  </nav>
</header>
<main>
  <div class="sites-list">
  <figure class="site-figure">
    <a class="site-card" href="https://tesseractprogram.pages.dev" target="_blank" rel="noopener" aria-label="Tesseract Program">
      <span class="card-logo">
        <svg class="emblem" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="tesseract-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#b8975a"/>
              <stop offset="100%" stop-color="#d9bf86"/>
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#tesseract-gold)" stroke-width="5" stroke-linejoin="miter" stroke-linecap="butt">
            <rect x="2.5" y="2.5" width="135" height="135"/>
            <rect x="41.25" y="41.25" width="57.5" height="57.5"/>
            <line x1="2.5" y1="2.5" x2="41.25" y2="41.25"/>
            <line x1="137.5" y1="2.5" x2="98.75" y2="41.25"/>
            <line x1="2.5" y1="137.5" x2="41.25" y2="98.75"/>
            <line x1="137.5" y1="137.5" x2="98.75" y2="98.75"/>
          </g>
        </svg>
        <span class="card-word">TESSERACT</span>
      </span>
    </a>
    <figcaption class="caption">Tesseract Program — podcast</figcaption>
  </figure>
  <figure class="site-figure">
    <a class="more-card" href="more/">More websites</a>
  </figure>
  </div>
</main>
</body>
</html>
