<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111">
<title>Websites — Josh Freeman</title>
<meta name="description" content="Websites">
<meta property="og:title" content="Websites — Josh Freeman">
<meta property="og:site_name" content="joshfreeman.org">
<meta property="og:url" content="https://joshfreeman.org/websites/">
<link rel="canonical" href="https://joshfreeman.org/websites/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100svh;min-height:100dvh}
header{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 16px;
  padding:12px 20px;
  padding-top:calc(12px + env(safe-area-inset-top));
  padding-right:calc(20px + env(safe-area-inset-right));
  padding-left:calc(20px + env(safe-area-inset-left));
}
header nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
a{color:#fff}
h1{font-size:1.2rem;margin:0;font-weight:500}
a:focus-visible,button:focus-visible,.site-card:focus-visible{outline:3px solid #0a5bd8;outline-offset:3px}
main{
  display:flex;flex-direction:column;align-items:center;
  padding:28px 20px 64px;
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + env(safe-area-inset-right));
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.page-stack{width:min(999px,100%);display:flex;flex-direction:column;gap:48px}
.group{margin:0;display:flex;flex-direction:column;gap:16px}
.group-label{margin:0 2px;font-size:.8rem;font-weight:500;color:#ccc;letter-spacing:.08em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr;gap:18px 18px;align-items:start}
@media (min-width:700px){
  .grid-2{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:1fr 1fr}
  .span-2{grid-column:1/-1}
}
@media (min-width:960px){
  .grid-3{grid-template-columns:1fr 1fr 1fr}
  .grid-3 .span-2{grid-column:auto}
}
.site-figure{margin:0;width:100%;min-width:0;display:flex;flex-direction:column}
.site-card{
  display:block;width:100%;flex:1 0 auto;text-decoration:none;color:inherit;
  background:#0a0a0a;border:1px solid transparent;
}
.site-card:hover{outline:1px solid #d9bf86;outline-offset:4px}
a.site-card:focus-visible{outline:3px solid #0a5bd8;outline-offset:4px}
.site-card.is-soon{cursor:default;opacity:.92}
.site-card.is-soon:hover{outline:1px solid #444;outline-offset:4px}
.card-inner{
  display:flex;align-items:center;
  gap:clamp(14px,4vw,32px);
  padding:clamp(20px,4vw,32px) clamp(18px,4.5vw,40px);
  min-height:112px;
}
.card-inner.center{justify-content:center;text-align:center}
.card-inner.stack{flex-direction:column;align-items:flex-start;justify-content:space-between;gap:18px;min-height:148px}
.mark{height:clamp(52px,11vw,88px);width:auto;flex:0 0 auto;display:block}
.logo{width:min(380px,86%);height:auto;display:block}
.logo-on-light{background:#fff;padding:clamp(12px,3vw,24px);min-height:160px}
.logo-on-light .logo{width:min(220px,70%);height:auto;max-height:160px;object-fit:contain}
.card-name{
  font-family:Oswald,Arial,sans-serif;
  font-weight:500;
  font-size:clamp(1.5rem,5vw,2.6rem);
  letter-spacing:.18em;
  line-height:1;
  color:#f5f5f5;
  margin:0;
  white-space:nowrap;
}
.card-domain,.card-title{
  font-family:system-ui,-apple-system,sans-serif;
  font-weight:500;
  font-size:clamp(1.25rem,3.6vw,1.7rem);
  letter-spacing:.02em;
  color:#f0e8d8;
  margin:0;
}
.card-title{line-height:1.15}
.card-kicker{margin:0;font-size:.8rem;color:#9a9a9a;letter-spacing:.04em}
.badge{
  display:inline-block;font-size:.68rem;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:#d9bf86;border:1px solid #d9bf86;
  padding:3px 8px;border-radius:999px;white-space:nowrap;
}
.caption{
  margin:12px 2px 0;
  flex:0 0 auto;
  font-size:.85rem;
  color:#ccc;
  text-align:center;
  font-weight:400;
  line-height:1.4;
}
/* Settings card only — other cards unchanged */
.card-inner.photo{
  position:relative;
  display:block;
  padding:0;
  min-height:0;
  gap:0;
  overflow:hidden;
}
.settings-card-art{
  width:100%;
  height:auto;
  display:block;
  aspect-ratio:5/4;
  object-fit:cover;
  object-position:center 35%;
}
.settings-card-title{
  position:absolute;
  left:0;right:0;bottom:0;
  padding:20px 16px 14px;
  background:linear-gradient(to top, rgba(0,0,0,.62), transparent);
  color:#fff8f0;
}
/* Tesseract featured card, matched to /websites/ */
.tess{container-type:inline-size;container-name:logo;background:#0a0a0a}
.tess-logo{
  display:flex;align-items:center;
  aspect-ratio:999/227;
  padding:4.905cqi 5.806cqi 3.804cqi 3.504cqi;
  gap:8.108cqi;
  background:#0a0a0a;
}
.emblem{width:14.114cqi;height:auto;flex:0 0 auto;display:block}
.card-word{
  font-family:Cinzel,Georgia,"Times New Roman",serif;
  font-weight:400;
  font-size:8.579cqi;
  color:#f0e8d8;
  letter-spacing:.313em;
  margin:0 -.313em 0 0;
  line-height:1;
  white-space:nowrap;
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1>Websites</h1>
  <nav aria-label="Site">
    <a href="../gallery/">Full Gallery</a>
    <a href="../">← Home</a>
  </nav>
</header>
<main>
  <div class="page-stack">

    <section class="group" aria-label="Tesseract Program">
      <figure class="site-figure">
        <a class="site-card tess" href="https://tesseractprogram.pages.dev" target="_blank" rel="noopener" aria-label="Tesseract Program">
          <span class="tess-logo">
            <svg class="emblem" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="tesseract-gold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#b8975a"/>
                  <stop offset="100%" stop-color="#d9bf86"/>
                </linearGradient>
              </defs>
              <g fill="none" stroke="url(#tesseract-gold)" stroke-width="5" stroke-linejoin="miter" stroke-linecap="butt">
                <rect x="2.5" y="2.5" width="135" height="135"/>
                <rect x="41.25" y="41.25" width="57.5" height="57.5"/>
                <line x1="2.5" y1="2.5" x2="41.25" y2="41.25"/>
                <line x1="137.5" y1="2.5" x2="98.75" y2="41.25"/>
                <line x1="2.5" y1="137.5" x2="41.25" y2="98.75"/>
                <line x1="137.5" y1="137.5" x2="98.75" y2="98.75"/>
              </g>
            </svg>
            <span class="card-word">TESSERACT</span>
          </span>
        </a>
        <figcaption class="caption">Tesseract Program — podcast</figcaption>
      </figure>
    </section>

    <section class="group" aria-labelledby="hue-label">
      <h2 id="hue-label" class="group-label">Hue</h2>
      <div class="grid grid-2">
        <figure class="site-figure">
          <a class="site-card" href="https://allyat.com" target="_blank" rel="noopener" aria-label="ALLYAT">
            <span class="card-inner">
              <img class="mark" src="../images/allyat-mark.png" alt="" width="280" height="281">
              <span class="card-name">ALLYAT</span>
            </span>
          </a>
          <figcaption class="caption">The mechanisms of transformation — an institute for prosperity</figcaption>
        </figure>
        <figure class="site-figure">
          <a class="site-card" href="https://hue.buzz" target="_blank" rel="noopener" aria-label="hue.buzz">
            <span class="card-inner center stack" style="align-items:center;justify-content:center">
              <img class="logo" src="../images/hue-buzz.jpg" alt="" width="900" height="675">
              <span class="card-domain">hue.buzz</span>
            </span>
          </a>
        </figure>
      </div>
    </section>

    <section class="group" aria-labelledby="augustus-label">
      <h2 id="augustus-label" class="group-label">Augustus</h2>
      <figure class="site-figure">
        <a class="site-card" href="https://pallante.com" target="_blank" rel="noopener" aria-label="Pallante Branding House">
          <span class="card-inner center">
            <img class="logo" src="../images/pallante-logo.png" alt="Pallante Branding House" width="922" height="452">
          </span>
        </a>
        <figcaption class="caption">Pallante Branding House</figcaption>
      </figure>
    </section>

    <section class="group" aria-label="Wampum World">
      <figure class="site-figure">
        <a class="site-card" href="https://wampumworld.com" target="_blank" rel="noopener" aria-label="Wampum World">
          <span class="card-inner center">
            <img class="logo" src="../images/wampumworld-logo.png" alt="Wampum World" width="347" height="114">
          </span>
        </a>
        <figcaption class="caption">Wampum World — quahog wampum jewelry</figcaption>
      </figure>
    </section>

    <section class="group" aria-label="Tower Jewelry and Shop">
      <div class="grid grid-2">
        <figure class="site-figure">
          <a class="site-card" href="tower/" aria-label="Tower Jewelry, logo concepts">
            <span class="card-inner center logo-on-light">
              <img class="logo" src="tower/img/tower-logo.jpg" alt="Tower Jewelry logo concept" width="1024" height="1024">
            </span>
          </a>
          <figcaption class="caption">Tower Jewelry, logo concepts</figcaption>
        </figure>
        <figure class="site-figure">
          <a class="site-card" href="shop/" aria-label="Shop">
            <span class="card-inner center stack" style="align-items:center;justify-content:center">
              <span class="card-title">Shop</span>
            </span>
          </a>
          <figcaption class="caption">Items for sale</figcaption>
        </figure>
      </div>
    </section>

    <section class="group" aria-label="Other sites">
      <div class="grid grid-3">
        <article class="site-figure">
          <a class="site-card" href="/settings/" aria-label="Settings">
            <span class="card-inner photo">
              <picture>
                <source type="image/webp" srcset="../images/settings-cover.webp">
                <img class="settings-card-art" src="../images/settings-cover.jpg" alt="" width="1200" height="960">
              </picture>
              <span class="card-title settings-card-title">Settings</span>
            </span>
          </a>
          <p class="caption">Richard's Providence findings and settings work</p>
        </article>
        <article class="site-figure">
          <a class="site-card" href="https://joshfreeman.org/london-boroughs/" target="_blank" rel="noopener" aria-label="London Boroughs">
            <span class="card-inner stack">
              <span class="card-title">London Boroughs</span>
            </span>
          </a>
          <p class="caption">All 33 areas, with Redbridge featured</p>
        </article>
        <article class="site-figure" id="redbridge">
          <a class="site-card" id="redbridge-card" href="redbridge/" aria-label="Redbridge Council">
            <span class="card-inner stack">
              <span class="card-title">Redbridge Council</span>
            </span>
          </a>
          <p class="caption">Redbridge Council: suggestions on housing, homelessness and the hospital network.</p>
        </article>
      </div>
    </section>

    <section class="group" aria-label="Design ideas">
      <div class="grid grid-2">
        <figure class="site-figure">
          <a class="site-card" href="spa/" aria-label="Spa design ideas">
            <span class="card-inner stack">
              <span class="card-title">Spa design ideas</span>
            </span>
          </a>
          <figcaption class="caption">Concepts for spa and studio spaces, starting with hot yoga</figcaption>
        </figure>
        <figure class="site-figure">
          <a class="site-card" href="cat-house/" aria-label="Outdoor Cat House">
            <span class="card-inner stack">
              <span class="card-title">Outdoor Cat House</span>
            </span>
          </a>
          <figcaption class="caption">Cozy, weatherproof cat house design: specs, materials and build steps.</figcaption>
        </figure>
      </div>
    </section>

  </div>
</main>
</body>
</html>
