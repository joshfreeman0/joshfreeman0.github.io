<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111">
<title>Tower Jewelry — Logo concepts</title>
<meta name="description" content="Tower Jewelry logo concepts">
<meta property="og:title" content="Tower Jewelry — Logo concepts">
<meta property="og:site_name" content="joshfreeman.org">
<meta property="og:url" content="https://joshfreeman.org/websites/tower/">
<link rel="canonical" href="https://joshfreeman.org/websites/tower/">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100svh;min-height:100dvh}
header{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 16px;
  padding:12px 20px;
  padding-top:calc(12px + env(safe-area-inset-top));
  padding-right:calc(20px + env(safe-area-inset-right));
  padding-left:calc(20px + env(safe-area-inset-left));
}
header nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
a{color:#fff}
h1{font-size:1.2rem;margin:0;font-weight:500}
a:focus-visible{outline:3px solid #0a5bd8;outline-offset:3px}
main{
  width:min(999px,100%);
  margin:0 auto;
  padding:28px 20px 64px;
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + env(safe-area-inset-right));
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.line{margin:0 0 28px;color:#f0e8d8;font-size:1.05rem;line-height:1.5;text-align:center}
.group-label{margin:0 2px 16px;font-size:.8rem;font-weight:500;color:#ccc;letter-spacing:.08em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr;gap:22px 18px}
@media (min-width:600px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr}}
figure{margin:0;display:flex;flex-direction:column;background:#0a0a0a}
figure img{width:100%;height:auto;aspect-ratio:1;object-fit:contain;background:#fff;display:block}
figcaption{margin:12px 10px 16px;font-size:.85rem;color:#ccc;text-align:center;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1>Tower Jewelry</h1>
  <nav aria-label="Site">
    <a href="../">Websites</a>
    <a href="../../gallery/">Full Gallery</a>
    <a href="../../">← Home</a>
  </nav>
</header>
<main>
  <p class="line">Every tower is built around something it loves.</p>
  <section aria-labelledby="concepts-label">
    <h2 id="concepts-label" class="group-label">Logo concepts</h2>
    <div class="grid">
      <figure>
        <img src="img/tower-logo.jpg" alt="Concept 1: Navy T-tower with a gold cap" width="1024" height="1024">
        <figcaption>Concept 1: Navy T-tower with a gold cap</figcaption>
      </figure>
      <figure>
        <img src="img/logo-gold-spire-heart-window.jpg" alt="Concept 2: Gold spire with a heart window" width="1024" height="1024">
        <figcaption>Concept 2: Gold spire with a heart window</figcaption>
      </figure>
      <figure>
        <img src="img/logo-love-heart-cap.jpg" alt="Concept 3: Navy tower with a gold heart cap" width="1024" height="1024">
        <figcaption>Concept 3: Navy tower with a gold heart cap</figcaption>
      </figure>
      <figure>
        <img src="img/logo-serif-wordmark.jpg" alt="Concept 4: Serif wordmark" width="1280" height="720">
        <figcaption>Concept 4: Serif wordmark</figcaption>
      </figure>
      <figure>
        <img src="img/logo-shield-badge.jpg" alt="Concept 5: Shield badge" width="1024" height="1024">
        <figcaption>Concept 5: Shield badge</figcaption>
      </figure>
      <figure>
        <img src="img/logo-t-heart-monogram.jpg" alt="Concept 6: T-heart monogram" width="1024" height="1024">
        <figcaption>Concept 6: T-heart monogram</figcaption>
      </figure>
      <figure>
        <img src="img/love_logo.jpg" alt="Concept 7: Love line" width="771" height="838">
        <figcaption>Concept 7: Love line</figcaption>
      </figure>
    </div>
  </section>
</main>
</body>
</html>
