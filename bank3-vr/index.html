<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank of the United States (3rd edition) – 360 concept tour</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px;background:rgba(0,0,0,.65);color:#fff;text-align:center}
#ui button{font-size:18px;margin:4px;padding:10px 16px;border-radius:8px;border:0;background:#c9a24a;color:#111;cursor:pointer}
#ui button.on{background:#fff}
#note{font-size:12px;opacity:.85;margin-top:4px}
</style></head><body>
<a-scene vr-mode-ui="enabled: true" renderer="colorManagement: true">
  <a-assets>
    <img id="terrace" src="pano_terrace.jpg" crossorigin="anonymous">
    <img id="grounds" src="pano_grounds.jpg" crossorigin="anonymous">
    <img id="hall" src="pano_hall.jpg" crossorigin="anonymous">
  </a-assets>
  <a-sky id="sky" src="#terrace" rotation="0 -90 0"></a-sky>
  <a-entity camera look-controls position="0 1.6 0">
    <a-entity cursor="fuse:false; rayOrigin:mouse" raycaster="objects:.btn"></a-entity>
  </a-entity>
  <a-entity laser-controls="hand:right" raycaster="objects:.btn"></a-entity>
  <a-entity laser-controls="hand:left" raycaster="objects:.btn"></a-entity>
  <a-entity id="vrbar" position="0 0.6 -2.2" rotation="-25 0 0">
    <a-plane class="btn" data-t="terrace" position="-1.0 0 0" width="0.9" height="0.28" color="#c9a24a"><a-text value="Hilltop terrace" align="center" color="#111" width="2"></a-text></a-plane>
    <a-plane class="btn" data-t="grounds" position="0 0 0" width="0.9" height="0.28" color="#c9a24a"><a-text value="Grounds" align="center" color="#111" width="2"></a-text></a-plane>
    <a-plane class="btn" data-t="hall" position="1.0 0 0" width="0.9" height="0.28" color="#c9a24a"><a-text value="Banking hall" align="center" color="#111" width="2"></a-text></a-plane>
  </a-entity>
</a-scene>
<div id="ui">
  <button data-t="terrace" class="on">Hilltop terrace</button>
  <button data-t="grounds">Grounds (deer &amp; turkeys)</button>
  <button data-t="hall">Banking hall</button>
  <div id="note">Concept renderings (AI-generated), not real photos. Mockup/concept only: not a chartered institution. In a Quest browser, tap "Enter VR" (goggles icon).</div>
</div>
<script>
function show(t){
  document.getElementById('sky').setAttribute('src','#'+t);
  document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
}
document.querySelectorAll('#ui button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));
AFRAME.registerComponent('noop',{});
document.querySelectorAll('.btn').forEach(e=>e.addEventListener('click',()=>show(e.dataset.t)));
</script></body></html>
