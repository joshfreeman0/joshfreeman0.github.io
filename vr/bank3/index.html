<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank of the United States (3rd edition) – 360 concept tour</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="../locomotion.js?v=9"></script>
<script src="../hd.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px;background:rgba(0,0,0,.65);color:#fff;text-align:center}
#ui button{font-size:18px;margin:4px;padding:10px 16px;border-radius:8px;border:0;background:#c9a24a;color:#111;cursor:pointer}
#ui button.on{background:#fff}
#note{font-size:12px;opacity:.85;margin-top:4px}
</style></head><body>
<a-scene vr-mode-ui="enabled: true" renderer="antialias: true; colorManagement: true; highRefreshRate: true; foveationLevel: 0; anisotropy: 16; maxCanvasWidth: 3840; maxCanvasHeight: 2160; precision: high" hd-renderer="scale: 1.5">
  <a-entity id="sky" hd-sky="src: pano_terrace.jpg?v=2"></a-entity>
  <a-entity id="rig" wasd-controls="acceleration: 25">
    <a-entity id="flydisk" position="0 6 0" rotation="90 0 0"><a-plane class="btn" fly-toggle width="1.6" height="0.42" material="src:url(/vr/winged-sun-stone.jpg);side:double;shader:flat"></a-plane><a-text id="flylabel" value="Fly: OFF" align="center" position="0 -0.4 0" width="1.6" color="#ffe9a8" side="double"></a-text></a-entity>
    <a-entity camera="near: 0.05; far: 2000" look-controls wasd-controls="enabled:false" position="0 1.6 0">
    <a-entity cursor="fuse:false; rayOrigin:mouse" raycaster="objects:.btn"></a-entity>
  </a-entity>
  <a-entity laser-controls="hand:right" snap-turn raycaster="objects:.btn"></a-entity>
  <a-entity laser-controls="hand:left" thumbstick-move menu-toggle raycaster="objects:.btn"></a-entity>
  </a-entity>
  <a-entity id="markers"></a-entity>
  <a-entity id="vrbar" position="0 0.6 -2.2" rotation="-25 0 0">
    <a-plane class="btn" data-t="terrace" position="-1.0 0 0" width="0.9" height="0.28" material="shader:flat;color:#FFD700"><a-text value="Hilltop terrace" align="center" color="#111" width="2"></a-text></a-plane>
    <a-plane class="btn" data-t="grounds" position="0 0 0" width="0.9" height="0.28" material="shader:flat;color:#FFD700"><a-text value="Grounds" align="center" color="#111" width="2"></a-text></a-plane>
    <a-plane class="btn" data-t="hall" position="1.0 0 0" width="0.9" height="0.28" material="shader:flat;color:#FFD700"><a-text value="Banking hall" align="center" color="#111" width="2"></a-text></a-plane>
    <a-plane class="btn" data-t="greenhouse" position="0 -0.7 0" width="1.4" height="0.28" material="shader:flat;color:#FFD700"><a-text value="Tropical conservatory" align="center" color="#111" width="2.4"></a-text></a-plane>
    <a-plane class="btn" data-t="office" position="0 -0.35 0" width="1.4" height="0.28" material="shader:flat;color:#FFD700"><a-text value="Josh's top-floor office" align="center" color="#111" width="2.4"></a-text></a-plane>
    <a-plane class="btn" data-reload="1" position="0 -1.05 0" width="0.9" height="0.28" material="shader:flat;color:#FFD700"><a-text value="Reload world" align="center" color="#111" width="2"></a-text></a-plane>
  </a-entity>
</a-scene>
<div id="ui">
  <button data-t="terrace" class="on">Colonnade terrace</button>
  <button data-t="grounds">Sphinx avenue &amp; grounds</button>
  <button data-t="hall">Banking hall</button>
  <button data-t="greenhouse">Tropical conservatory</button>
  <button data-t="office">From Josh's top-floor office</button>
  <div id="note">Concept renderings (AI-generated), not real photos. Mockup/concept only: not a chartered institution. In a Quest browser, tap "Enter VR" (goggles icon).</div>
</div>
<script>
function show(t){
  document.getElementById('sky').setAttribute('hd-sky','src','pano_'+t+'.jpg?v=2');
  document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
}
document.querySelectorAll('#ui button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));
AFRAME.registerComponent('noop',{});
document.querySelectorAll('[data-reload]').forEach(e=>e.addEventListener('click',()=>{const u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u.toString());}));
document.querySelectorAll('.btn').forEach(e=>e.addEventListener('click',()=>{if(e.dataset.t)show(e.dataset.t)}));
</script></body></html>
