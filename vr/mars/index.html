<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<script>
/* Fowling Pond -> Mars, same-origin arrival (joshfreeman.org/vr/mars/). Quest keeps an immersive session across a navigation only
   when it is SAME-ORIGIN (joshfreeman.org -> redplanetlounge.pages.dev drops to 2D), and the new page has ~5 s to start drawing.
   /vr/xrhold.js grabs the granted session first thing and keeps it alive with black frames; Red Planet Lounge's live code
   (from redplanetlounge.pages.dev, unchanged) is loaded only once that keep-alive is drawing, then gets the same session. */
window.JFMARS = { log: [], fallback: function () { location.replace('https://redplanetlounge.pages.dev/' + location.search + location.hash); } };
</script>
<script src="/vr/xrhold.js?v=1" data-features='{"optionalFeatures":["local-floor","bounded-floor","layers","local-floor","bounded-floor"]}'></script>
<base href="https://redplanetlounge.pages.dev/">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Red Planet Lounge - a nightclub in a Mars colony</title>
<meta name="theme-color" content="#b5532d">
<link rel="icon" href="data:,">
</head><body style="background:#000">
<script>
/* Pull RPL's live page (so it always matches Me's latest deploy), take its import map, styles and body, then run its main.js. */
(function () {
  var RPL = 'https://redplanetlounge.pages.dev/', H = window.JFMARS, XH = window.JFXR || { granted: false };
  function abs(u) { return new URL(u, RPL).href; }
  // Wait briefly for Quest's sessiongranted; if it comes, hold off RPL's heavy load until the keep-alive has drawn ~20 frames.
  var ready = new Promise(function (res) {
    var t0 = performance.now();
    (function wait() { if (XH.granted) { XH.whenFrames(20, res); setTimeout(res, 4000); return; } if (performance.now() - t0 > 800) return res(); setTimeout(wait, 25); })();
  });
  ready.then(function () { return fetch(RPL + location.search, { cache: 'no-cache' }); }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(function (html) {
    var d = new DOMParser().parseFromString(html, 'text/html'), mods = [];
    d.querySelectorAll('script[type="importmap"]').forEach(function (s) {
      var m = JSON.parse(s.textContent); Object.keys(m.imports || {}).forEach(function (k) { m.imports[k] = abs(m.imports[k]); });
      var n = document.createElement('script'); n.type = 'importmap'; n.textContent = JSON.stringify(m); document.head.appendChild(n);
    });
    d.querySelectorAll('link[rel="stylesheet"], style').forEach(function (l) {
      var n = l.cloneNode(true); if (n.href) n.href = abs(l.getAttribute('href')); document.head.appendChild(n);
    });
    var meta = d.querySelector('meta[name="description"]'); if (meta) document.head.appendChild(meta.cloneNode(true));
    Array.prototype.slice.call(d.body.childNodes).forEach(function (c) {
      if (c.nodeName === 'SCRIPT') { if (c.type === 'module' && c.getAttribute('src')) mods.push(abs(c.getAttribute('src'))); return; }
      document.body.appendChild(document.importNode(c, true));
    });
    document.body.style.background = '';
    if (!mods.length) throw new Error('no RPL module');
    return mods.reduce(function (p, u) { return p.then(function () { return import(u); }); }, Promise.resolve());
  }).then(function () {
    H.log.push('RPL loaded');
    // RPL listens for sessiongranted only once its world is built; if Quest fired it earlier, send it again for RPL.
    var t0 = performance.now(), sent = false;
    (function poll() {
      if (!XH.granted || sent || XH.handed) return;
      var b = document.getElementById('VRButton');
      if (b && /ENTER VR/i.test(b.textContent)) { sent = true; var e = new Event('sessiongranted'); e.jfResent = true; navigator.xr.dispatchEvent(e); H.log.push('re-sent sessiongranted'); return; }
      if (performance.now() - t0 < 20000) setTimeout(poll, 100);
    })();
  }).catch(function (e) { console.warn('mars wrapper:', e); H.fallback(); });
})();
</script>
</body></html>
