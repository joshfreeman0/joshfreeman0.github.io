<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you - Josh Freeman</title>
<meta property="og:title" content="Thank you - Josh Freeman">
<meta property="og:url" content="https://joshfreeman.org/submit/thanks/">
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Jost",system-ui,-apple-system,sans-serif;font-weight:300;background:#f6f5f3;color:#111;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding:max(32px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,9vw,3.2rem);line-height:1.1;margin-bottom:12px;text-align:center}
p.intro{color:#333;font-size:1.05rem;margin-bottom:12px}
p.note{color:#555;font-size:.95rem;margin-bottom:24px}
label{display:block;font-weight:400;margin:16px 0 6px;font-size:1rem}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea,input[type=file]{width:100%;font:inherit;font-size:16px;padding:12px;border:2px solid #cfcdc8;border-radius:8px;background:#fff;color:#111}
textarea{min-height:110px}
input:focus,textarea:focus{outline:3px solid #0a5bd8;outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{color:#666;font-size:.85rem;margin-top:4px}
.chk{display:flex;gap:12px;align-items:flex-start;margin:22px 0}
.chk input{width:24px;height:24px;margin-top:3px;flex:none}
.chk label{margin:0;font-weight:300}
button.btn,a.btn{display:block;width:100%;text-align:center;padding:18px 20px;min-height:60px;background:#111;color:#fff;text-decoration:none;font:inherit;font-size:1.15rem;font-weight:400;letter-spacing:.03em;border-radius:10px;border:2px solid #111;cursor:pointer}
button.btn:hover,a.btn:hover,button.btn:focus-visible,a.btn:focus-visible{background:#fff;color:#111;outline:3px solid #0a5bd8;outline-offset:2px}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.back{display:inline-block;margin-top:20px;color:#111;text-decoration:underline;text-underline-offset:3px}
.c{text-align:center}
@media(max-width:420px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Thank you</h1>
<p class="intro c">Your submission was received. I will review it and be in touch if your work is selected.</p>
<p class="c"><a class="back" href="/">&larr; Back to home</a></p>
</main>
</body>
</html>
